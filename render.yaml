services:
  - type: web
    name: ElectroBeasts
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Bind to the port Render injects. The old config ran `python backend.py`,
    # which never started a server.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
